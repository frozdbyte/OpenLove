<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#e11d48" />
		<meta name="description" content="Open Love - Track how long you have been together in romantic style." />
		<meta name="apple-mobile-web-app-title" content="Open Love" />
		<meta name="application-name" content="Open Love" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		
		<!-- Google Fonts for Modern Sans & Elegant Romantic Serif -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

		<!-- Capture beforeinstallprompt early before framework hydration -->
		<script>
			window.addEventListener('beforeinstallprompt', function(e) {
				e.preventDefault();
				window.__pwaInstallPrompt = e;
			});
		</script>

		<title>Open Love</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full min-h-dvh bg-background text-foreground font-sans antialiased selection:bg-primary/20 selection:text-primary overflow-x-hidden">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
