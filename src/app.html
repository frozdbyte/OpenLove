<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#e11d48" />
		<meta name="description" content="Open Love - Track how long you have been together in romantic style." />
		<meta name="apple-mobile-web-app-title" content="Open Love" />
		<meta name="application-name" content="Open Love" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- Prevent theme flashbang on initial page load by resolving dark mode and theme synchronously -->
		<script>
			(function () {
				try {
					var mode = localStorage.getItem('openlove_theme_mode');
					var palette = localStorage.getItem('openlove_theme_palette') || 'rose';
					var uiTheme = localStorage.getItem('openlove_theme_ui') || 'modern';

					var isDark = false;
					if (mode === 'dark') {
						isDark = true;
					} else if (mode === 'light') {
						isDark = false;
					} else {
						isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					}

					var root = document.documentElement;
					if (isDark) {
						root.classList.add('dark');
					} else {
						root.classList.remove('dark');
					}
					root.setAttribute('data-theme', palette);

					var metaTheme = document.querySelector('meta[name="theme-color"]');
					if (metaTheme) {
						if (uiTheme === 'traditional') {
							metaTheme.setAttribute('content', isDark ? '#4a0e17' : '#8B1E2D');
						} else {
							metaTheme.setAttribute('content', isDark ? '#18181b' : '#e11d48');
						}
					}
				} catch (e) {}
			})();
		</script>

		<!-- Fonts are self-hosted via @fontsource-variable and imported from app.css, so they
		     are precached with the rest of the bundle and never leak an IP to a third party. -->

		<!-- Capture beforeinstallprompt early before framework hydration -->
		<script>
			window.addEventListener('beforeinstallprompt', function(e) {
				e.preventDefault();
				window.__pwaInstallPrompt = e;
			});
		</script>

		<title>Open Love</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full min-h-dvh bg-background text-foreground font-sans antialiased selection:bg-primary/20 selection:text-primary overflow-x-hidden">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
