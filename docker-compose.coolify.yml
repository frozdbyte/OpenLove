services:
  openlove:
    image: frozdbyte/openlove:latest
    environment:
      - SERVICE_FQDN_OPENLOVE_3000
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/openlove.db
      # Optional: Custom VAPID keys. If left unset, OpenLove auto-generates them into /app/data/vapid.json
      # - PUBLIC_VAPID_KEY=
      # - PRIVATE_VAPID_KEY=
      # - VAPID_SUBJECT=mailto:admin@yourdomain.com
      # The ${VAR:-default} form below (rather than a commented-out line) is what makes Coolify
      # surface each of these as an editable field, pre-filled with its default, in the service's
      # Environment Variables tab — a plain `# - VAR=value` comment never shows up in the UI at all.
      - FEATURE_SHARE_IMAGES=${FEATURE_SHARE_IMAGES:-true}
      - SHARED_IMAGE_TTL_HOURS=${SHARED_IMAGE_TTL_HOURS:-24}
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-Infinity}
    volumes:
      - openlove_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  openlove_data:
    driver: local
