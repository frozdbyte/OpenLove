services:
  openlove:
    image: frozdbyte/openlove:latest
    environment:
      - SERVICE_FQDN_OPENLOVE_3000
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/openlove.db
      # Optional: Custom VAPID keys. If left unset, OpenLove auto-generates them into /app/data/vapid.json
      # - PUBLIC_VAPID_KEY=
      # - PRIVATE_VAPID_KEY=
      # - VAPID_SUBJECT=mailto:admin@yourdomain.com
    volumes:
      - openlove_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  openlove_data:
    driver: local
